services:
  - type: web
    name: keday70-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://keday70-demo.vercel.app" # Ganti dengan URL Vercel yang sebenarnya
      - key: GROQ_API_KEY
        sync: false
